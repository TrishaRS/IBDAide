<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3BA89E"/>
      <stop offset="1" stop-color="#1E6560"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background (full-bleed; iOS/Android mask their own shapes) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="560" fill="url(#sheen)"/>

  <!-- Colon: large arch (ascending–transverse–descending) -->
  <path d="M 312 764 L 312 428 A 200 200 0 0 1 712 428 L 712 640"
        fill="none" stroke="#FFFFFF" stroke-width="62" stroke-linecap="round"/>

  <!-- Small intestine: three winding rows inside the arch -->
  <path d="M 434 420 H 584 A 45 45 0 0 1 584 510 H 438 A 45 45 0 0 0 438 600 H 584 A 45 45 0 0 1 584 690 H 448"
        fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" opacity="0.95"/>

  <!-- Aide badge: medical plus anchoring the descending colon -->
  <circle cx="726" cy="742" r="104" fill="#FFFFFF"/>
  <g fill="#1E6560">
    <rect x="704" y="678" width="44" height="128" rx="20"/>
    <rect x="662" y="720" width="128" height="44" rx="20"/>
  </g>
</svg>
